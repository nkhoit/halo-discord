name: Source CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
      - name: Enforce source-only repository
        run: node .github/scripts/verify-source-only.mjs
      - name: Install relay server dependencies
        run: npm ci
        working-directory: server
      - name: Check relay server
        run: npm run check
        working-directory: server
      - name: Test camera aim ownership (native C, no game assets)
        run: node --test port/linux/tests/halo_aim_device_test.js
      - name: Test keyboard crouch movement (native C, no game assets)
        run: node --test port/linux/tests/halo_crouch_movement_test.js
      - name: Test the keyboard and mouse bindings (native C, no game assets)
        run: node --test port/linux/tests/input_bindings_test.js
      - name: Test the 16-bit wide string helpers (native C, no game assets)
        run: node --test port/linux/tests/msvc_wide_test.js
      - name: Test that late joins leave broadcasts alone when off (native C, no game assets)
        run: node --test port/linux/tests/network_late_join_gate_test.js
      - name: Test a mid-match team switch (native C, no game assets)
        run: node --test port/linux/tests/team_switch_test.js
      - name: Test the netstats feel samples (native C, no game assets)
        run: node --test port/linux/tests/feel_sample_test.js
      - name: Test a spectator's view scope (native C, no game assets)
        run: node --test port/linux/tests/spectator_view_test.js
      - name: Test a spectator's effects (native C, no game assets)
        run: node --test port/linux/tests/effect_views_test.js
      - name: Test a client's replay of the host's relayed inputs (native C, no game assets)
        run: node --test port/linux/tests/relayed_input_test.js
      - name: Test the browser builds' compact messages (native C, no game assets)
        run: node --test port/linux/tests/compact_messages_test.js
      - name: Test the browser builds' compact input (native C, no game assets)
        run: node --test port/linux/tests/compact_input_test.js
      - name: Test browser JavaScript
        run: node --test port/web/tests/*.js
